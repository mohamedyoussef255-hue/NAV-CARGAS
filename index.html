    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta property="og:title" content="محطات كارجاس (الأقرب لك دائماً)" />
    <meta property="og:description" content="تطبيق محطات تموين الغاز الطبيعي كارجاس الأقرب لك دائماً مع خريطة تفاعلية أوفلاين وملاحة صوتية." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        var ua = (navigator.userAgent || '').toLowerCase();
        var isWv = !!(window.median || window.gonative || ua.indexOf('gonative') !== -1 || ua.indexOf('median') !== -1 || ua.indexOf('; wv)') !== -1);
        if (isWv) document.documentElement.dataset.webview = 'median';
        document.addEventListener('click', function (e) {
          var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
          if (!a) return;
          var href = a.getAttribute('href') || '';
          if (!href || href.charAt(0) === '#' || href.indexOf('javascript:') === 0) return;
          if (href.indexOf('geo:') === 0 || href.indexOf('tel:') === 0 || href.indexOf('mailto:') === 0) return;
          try {
            var u = new URL(href, window.location.href);
            if (u.origin === window.location.origin) {
              a.removeAttribute('target');
            }
          } catch (_) {}
        }, true);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
